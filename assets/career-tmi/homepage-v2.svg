<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
<title id="title">홈페이지 V2 핵심 아키텍처</title><desc id="desc">Next.js 화면과 NestJS API, PostgreSQL 데이터 계층. 상담 접수의 CRM 비동기 전달 경로는 구현 이력이며 8월 보고 기준 운영 비활성. GCS 업로드와 Google OAuth는 화면 측 연동이며 API 경로와 구분해 본문에 기술.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526782"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526782"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#182b44}.label{font-size:21px;font-weight:700}.sub{font-size:17px;fill:#425875}.hint{font-size:17px;fill:#425875}.app{fill:#eff5ff;stroke:#7695c4;stroke-width:1.7}.api{fill:#edf8f6;stroke:#64a39a;stroke-width:1.7}.data{fill:#f4f0fa;stroke:#a08cb8;stroke-width:1.7}.external{fill:#f8fafc;stroke:#9baabd;stroke-width:1.7}.edge{fill:none;stroke:#526782;stroke-width:2.3;stroke-linejoin:round}.dashed{stroke-dasharray:6 4}</style>
<g><rect x="8" y="8" width="212" height="80" rx="11" class="app"/><text x="114" y="43" class="label" text-anchor="middle">공개 사이트 · CMS</text><text x="114" y="68" class="sub" text-anchor="middle">Next.js · App Router</text></g><g><rect x="254" y="8" width="212" height="80" rx="11" class="api"/><text x="360" y="43" class="label" text-anchor="middle">홈페이지 API</text><text x="360" y="68" class="sub" text-anchor="middle">NestJS · Prisma</text></g><g><rect x="500" y="8" width="212" height="80" rx="11" class="data"/><text x="606" y="43" class="label" text-anchor="middle">콘텐츠 · 상담 데이터</text><text x="606" y="68" class="sub" text-anchor="middle">PostgreSQL · Cloud SQL</text></g><path d="M 222 48 H 250" class="edge" marker-end="url(#arrow)"/><path d="M 468 48 H 496" class="edge" marker-end="url(#arrow)"/><path class="edge" d="M 360 89 V 118 M 360 118 H 606"/><path d="M 114 89 V 144" class="edge" marker-end="url(#arrow)"/><g><rect x="8" y="148" width="212" height="74" rx="11" class="external"/><text x="114" y="180" class="label" text-anchor="middle">콘텐츠 · 인증</text><text x="114" y="205" class="sub" text-anchor="middle">GCS · Google OAuth</text></g><path d="M 360 118 V 144" class="edge" marker-end="url(#arrow)"/><g><rect x="254" y="148" width="212" height="74" rx="11" class="external"/><text x="360" y="180" class="label" text-anchor="middle">상담 검증</text><text x="360" y="205" class="sub" text-anchor="middle">reCAPTCHA v3</text></g><path d="M 606 118 V 144" class="edge dashed" marker-end="url(#arrow)"/><g><rect x="500" y="148" width="212" height="74" rx="11" class="external"/><text x="606" y="180" class="label" text-anchor="middle">CRM 전달 경로</text><text x="606" y="205" class="sub" text-anchor="middle">구현 · 운영은 비활성</text></g></svg>
