<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
<title id="title">사건관리 핵심 아키텍처</title><desc id="desc">화면에서 업무 API를 통해 PostgreSQL을 조회·변경. 트랜잭션 훅으로 감사로그와 이벤트를 처리하고 CRM 및 업무 API와 연동.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526782"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526782"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#182b44}.label{font-size:21px;font-weight:700}.sub{font-size:17px;fill:#425875}.hint{font-size:17px;fill:#425875}.app{fill:#eff5ff;stroke:#7695c4;stroke-width:1.7}.api{fill:#edf8f6;stroke:#64a39a;stroke-width:1.7}.data{fill:#f4f0fa;stroke:#a08cb8;stroke-width:1.7}.external{fill:#f8fafc;stroke:#9baabd;stroke-width:1.7}.edge{fill:none;stroke:#526782;stroke-width:2.3;stroke-linejoin:round}.dashed{stroke-dasharray:6 4}</style>
<g><rect x="8" y="8" width="212" height="80" rx="11" class="app"/><text x="114" y="43" class="label" text-anchor="middle">사건관리 화면</text><text x="114" y="68" class="sub" text-anchor="middle">React · TanStack Query</text></g><g><rect x="254" y="8" width="212" height="80" rx="11" class="api"/><text x="360" y="43" class="label" text-anchor="middle">업무 API · CRUD</text><text x="360" y="68" class="sub" text-anchor="middle">FastAPI · SQLAlchemy</text></g><g><rect x="500" y="8" width="212" height="80" rx="11" class="data"/><text x="606" y="43" class="label" text-anchor="middle">업무 데이터</text><text x="606" y="68" class="sub" text-anchor="middle">PostgreSQL · Cloud SQL</text></g><path d="M 222 48 H 250" class="edge" marker-end="url(#arrow)"/><path d="M 468 48 H 496" class="edge" marker-end="url(#arrow)"/><path class="edge" d="M 360 89 V 118 M 114 118 H 606"/><path d="M 114 118 V 144" class="edge" marker-end="url(#arrow)"/><g><rect x="8" y="148" width="212" height="74" rx="11" class="external"/><text x="114" y="180" class="label" text-anchor="middle">트랜잭션 훅</text><text x="114" y="205" class="sub" text-anchor="middle">감사로그 · SSE 이벤트</text></g><path d="M 360 118 V 144" class="edge" marker-end="url(#arrow)"/><g><rect x="254" y="148" width="212" height="74" rx="11" class="external"/><text x="360" y="180" class="label" text-anchor="middle">CRM 데이터</text><text x="360" y="205" class="sub" text-anchor="middle">FDW 배치 조회</text></g><path d="M 606 118 V 144" class="edge" marker-end="url(#arrow)"/><g><rect x="500" y="148" width="212" height="74" rx="11" class="external"/><text x="606" y="180" class="label" text-anchor="middle">업무 연동</text><text x="606" y="205" class="sub" text-anchor="middle">Gmail · Drive · 법원</text></g></svg>
