<svg xmlns="http://www.w3.org/2000/svg" width="720" height="254" viewBox="0 0 720 254" role="img" aria-labelledby="title desc">
<title id="title">KOGAS 분석 대상 시스템</title><desc id="desc">직접 구현이 아닌 기존 코드 분석 범위. 웹·현장 앱과 Go API, 인증 경계 및 WebSocket 실시간 경로.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526782"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526782"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#182b44}.label{font-size:21px;font-weight:700}.sub{font-size:17px;fill:#425875}.hint{font-size:17px;fill:#425875}.app{fill:#eff5ff;stroke:#7695c4;stroke-width:1.7}.api{fill:#edf8f6;stroke:#64a39a;stroke-width:1.7}.data{fill:#f4f0fa;stroke:#a08cb8;stroke-width:1.7}.external{fill:#f8fafc;stroke:#9baabd;stroke-width:1.7}.edge{fill:none;stroke:#526782;stroke-width:2.3;stroke-linejoin:round}.dashed{stroke-dasharray:6 4}</style>
<g><rect x="8" y="8" width="212" height="82" rx="11" class="app"/><text x="114" y="44" class="label" text-anchor="middle">웹 · Android 앱</text><text x="114" y="69" class="sub" text-anchor="middle">기존 운영 클라이언트</text></g><g><rect x="254" y="8" width="212" height="82" rx="11" class="api"/><text x="360" y="44" class="label" text-anchor="middle">Go API 서버</text><text x="360" y="69" class="sub" text-anchor="middle">gin-gonic · REST</text></g><g><rect x="500" y="8" width="212" height="82" rx="11" class="external"/><text x="606" y="44" class="label" text-anchor="middle">인증 · 파트너 연동</text><text x="606" y="69" class="sub" text-anchor="middle">JWT · API-Key</text></g><path d="M 222 49 H 250" class="edge" marker-end="url(#arrow)"/><path d="M 468 49 H 496" class="edge" marker-end="url(#arrow)"/><g><rect x="8" y="138" width="212" height="82" rx="11" class="external"/><text x="114" y="174" class="label" text-anchor="middle">현장 IoT 설비</text><text x="114" y="199" class="sub" text-anchor="middle">설비별 실시간 값</text></g><g><rect x="254" y="138" width="212" height="82" rx="11" class="api"/><text x="360" y="174" class="label" text-anchor="middle">WebSocket Hub</text><text x="360" y="199" class="sub" text-anchor="middle">Gorilla · 그룹별 전송</text></g><g><rect x="500" y="138" width="212" height="82" rx="11" class="app"/><text x="606" y="174" class="label" text-anchor="middle">웹 · 현장 앱</text><text x="606" y="199" class="sub" text-anchor="middle">실시간 모니터링</text></g><path d="M 222 179 H 250" class="edge" marker-end="url(#arrow)"/><path d="M 468 179 H 496" class="edge" marker-end="url(#arrow)"/><text x="360" y="247" class="hint" text-anchor="middle">분석 범위: 요청 처리 · 인증 경계 · 실시간 전달 · 배포 구조</text></svg>
